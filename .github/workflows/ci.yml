name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Offline: generated reference pages match the committed tables (no spec download in CI).
      - run: pnpm check:generated
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
